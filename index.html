<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitarbeiterunterweisung</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Loading Indicator -->
    <div id="loading-indicator">
        <svg class="animate-spin h-12 w-12 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span id="loading-text" class="mt-4">Verbinde mit Datenbank...</span>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="max-w-7xl mx-auto p-4 md:p-6 opacity-0 transition-opacity duration-500">

        <!-- Header -->
        <header class="bg-white rounded-xl shadow-md p-6 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Mitarbeiterunterweisungen</h1>
                <p id="headerSubtitle" class="text-gray-600 mt-1">Sicher & Nachverfolgbar</p>
            </div>
            <button
                id="logoutButton"
                class="hidden bg-red-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-red-600 transition"
            >
                Logout
            </button>
        </header>

        <!-- Screens -->
        <div id="loginScreen" class="app-screen active"></div>
        <div id="dashboardScreen" class="app-screen"></div>
        <div id="adminDashboardScreen" class="app-screen"></div>
        <div id="trainingScreen" class="app-screen"></div>
        <div id="quizScreen" class="app-screen"></div>
    </div>

    <!-- Modal Overlays -->
    <div id="courseEditorModal" class="modal-overlay"></div>
    <div id="passwordChangeModal" class="modal-overlay"></div>
    <div id="userEditorModal" class="modal-overlay"></div>

    <!-- Main Application Script -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
